<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運動紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F3F6; --surface:#FFFFFF; --ink:#151A24; --muted:#6C7483; --line:#DADFE6;
  --accent:#1E4FE0; --accent-ink:#FFFFFF; --accent-soft:#E3E9FC; --danger:#C62828; --danger-ink:#fff;
  --chip:#EDF0F4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111318; --surface:#1B1F27; --ink:#EDEFF3; --muted:#97A0B0; --line:#2B313C;
    --accent:#6A8CFF; --accent-ink:#0B1230; --accent-soft:#222C4D; --danger:#FF6B6B; --danger-ink:#2a0b0b;
    --chip:#242A35;
  }
}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1B1F27; --ink:#EDEFF3; --muted:#97A0B0; --line:#2B313C;
  --accent:#6A8CFF; --accent-ink:#0B1230; --accent-soft:#222C4D; --danger:#FF6B6B; --danger-ink:#2a0b0b;
  --chip:#242A35;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:"Barlow Condensed","Arial Narrow","Noto Sans TC",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 56px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 2px 12px}
.top .date{font-size:17px;font-weight:700}
.top .sum{color:var(--muted);font-size:15px}
.top .sum .num{color:var(--ink);font-size:26px;line-height:1;margin-right:2px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--chip);font-weight:500;font-size:15px;border:1.5px solid transparent}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.add{background:transparent;border-color:var(--line);color:var(--muted)}

.counter{background:var(--surface);border-radius:20px;padding:18px 14px 14px;margin-top:4px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:6px}
.step{height:64px;border-radius:16px;background:var(--chip);font-size:30px;line-height:1}
.step:active{transform:scale(.96)}
.reps{width:100%;border:0;background:transparent;text-align:center;color:var(--ink);font-size:84px;line-height:1;padding:0;margin:0;-moz-appearance:textfield}
.reps::-webkit-outer-spin-button,.reps::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{text-align:center;color:var(--muted);font-size:14px;margin-top:-4px}
.quick{display:flex;gap:8px;justify-content:center;margin:12px 0 14px;flex-wrap:wrap}
.quick button{min-width:46px;height:38px;padding:0 10px;border-radius:12px;background:var(--chip);font-size:17px}
.log{width:100%;height:58px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:19px}
.log:active{transform:scale(.985)}
.log:disabled{opacity:.5}
.log.pop{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.log.pop{animation:none}}

section.block{margin-top:22px}
h2{font-size:14px;font-weight:700;color:var(--muted);margin:0 0 8px 2px}
.day{background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.day .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.day .head b{font-size:15px}
.day .head span{color:var(--muted);font-size:14px}
.day .head span .num{color:var(--ink);font-size:18px}
.row{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .ex{font-weight:500;font-size:15px}
.row .sets{display:flex;flex-wrap:wrap;gap:6px}
.set{height:32px;min-width:36px;padding:0 10px;border-radius:10px;background:var(--chip);font-size:19px;display:inline-flex;align-items:center;justify-content:center}
.set.armed{background:var(--danger);color:var(--danger-ink);font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:14px}
.row .tot{font-size:22px;color:var(--ink);line-height:1}
.row .tot small{font-family:"Noto Sans TC",sans-serif;font-weight:400;font-size:13px;color:var(--muted);margin-left:2px}
.empty{color:var(--muted);font-size:15px;padding:6px 2px}

.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{padding:6px 14px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stat{background:var(--surface);border-radius:18px;padding:4px 14px;margin-bottom:10px}
.srow{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .ex{font-weight:500}
.srow .v{text-align:right;font-size:24px;line-height:1}
.srow .v small{display:block;font-family:"Noto Sans TC",sans-serif;font-weight:400;font-size:12px;color:var(--muted);line-height:1.4;margin-top:3px}
.bars{background:var(--surface);border-radius:18px;padding:12px 14px 8px}
.bars .cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.barsgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:72px}
.bar{background:var(--accent);border-radius:4px 4px 2px 2px;min-height:2px;opacity:.9}
.bar.zero{background:var(--line);opacity:1}
.bar.today{outline:2px solid var(--ink);outline-offset:1px}
.barlabels{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:4px}
.barlabels span{text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.data{background:var(--surface);border-radius:18px;padding:12px 14px}
.data p{margin:0 0 10px;color:var(--muted);font-size:14px}
.data .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.data .btns button{height:46px;border-radius:12px;background:var(--chip);font-weight:500;font-size:15px}
.data .btns button.wide{grid-column:1 / -1}
.data .btns button.danger{color:var(--danger)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.panel h3{margin:0 0 10px;font-size:17px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:14px}
.exrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.exrow input{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font-size:16px}
.exrow button{height:46px;width:46px;border-radius:12px;background:var(--chip);color:var(--muted);font-size:20px}
.panel .actions{display:flex;gap:8px;margin-top:12px}
.panel .actions button{flex:1;height:50px;border-radius:14px;font-weight:700;font-size:16px;background:var(--chip)}
.panel .actions button.primary{background:var(--accent);color:var(--accent-ink)}
.panel .actions button.danger{background:var(--danger);color:var(--danger-ink)}
.ghost{width:100%;height:44px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:15px}
textarea.box{width:100%;height:150px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
input[type=file]{font-size:14px;margin-bottom:10px;max-width:100%}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{display:none;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:10px}
.notice.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="date" id="todayDate"></div>
    <div class="sum"><span class="num" id="todayTotal">0</span>下 · <span id="todaySets">0</span> 組</div>
  </header>

  <div class="notice" id="notice"></div>

  <div class="chips" id="chips"></div>

  <section class="counter">
    <div class="stepper">
      <button class="step" id="minus" aria-label="減一下">−</button>
      <input class="num reps" id="reps" type="number" inputmode="numeric" min="1" max="999" value="8" aria-label="這組幾下">
      <button class="step" id="plus" aria-label="加一下">＋</button>
    </div>
    <div class="unit">這組幾下</div>
    <div class="quick" id="quick"></div>
    <button class="log" id="log">記一組</button>
  </section>

  <section class="block">
    <h2>今天</h2>
    <div class="day" id="todayDay"></div>
    <div class="empty" id="todayEmpty" style="display:none">還沒開始，拉一組就會出現在這裡。</div>
  </section>

  <section class="block">
    <h2>統計</h2>
    <div class="seg" id="seg">
      <button data-r="week" class="on">本週</button>
      <button data-r="month">本月</button>
      <button data-r="all">全部</button>
    </div>
    <div class="stat" id="statRows"></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="block">
    <h2>之前</h2>
    <div id="history"></div>
  </section>

  <section class="block">
    <h2>備份</h2>
    <div class="data">
      <p>紀錄只存在這支手機的瀏覽器裡。清掉瀏覽器資料或換手機前，先匯出備份。</p>
      <div class="btns">
        <button id="exportJson">匯出備份</button>
        <button id="exportCsv">匯出 CSV</button>
        <button id="importBtn" class="wide">匯入備份</button>
        <button id="clearAll" class="wide danger">清除全部紀錄</button>
      </div>
    </div>
  </section>
</div>

<div class="sheet" id="sheet">
  <div class="panel" role="dialog" aria-label="管理動作">
    <h3>動作清單</h3>
    <div id="exList"></div>
    <button class="ghost" id="addRow">＋ 新增一個動作</button>
    <div class="actions">
      <button id="cancelEx">取消</button>
      <button class="primary" id="saveEx">儲存</button>
    </div>
  </div>
</div>

<div class="sheet" id="exportSheet">
  <div class="panel" role="dialog" aria-label="匯出">
    <h3 id="exportTitle">匯出</h3>
    <p id="exportHint">按「下載檔案」存成檔案。如果沒有出現下載，就按「複製」再貼到記事本或訊息裡。</p>
    <textarea class="box" id="exportBox" readonly></textarea>
    <div class="actions">
      <button id="exportCopy">複製</button>
      <button id="exportShare" style="display:none">分享</button>
      <button class="primary" id="exportDl">下載檔案</button>
    </div>
    <div class="actions"><button id="exportClose">關閉</button></div>
  </div>
</div>

<div class="sheet" id="importSheet">
  <div class="panel" role="dialog" aria-label="匯入">
    <h3>匯入備份</h3>
    <p>選擇之前匯出的備份檔，或把備份內容貼在下面。會跟現有紀錄合併，不會重複。</p>
    <input type="file" id="importFile" accept=".json,application/json,text/plain">
    <textarea class="box" id="importBox" placeholder="把備份內容貼在這裡"></textarea>
    <div class="actions">
      <button id="importCancel">取消</button>
      <button class="primary" id="importGo">匯入</button>
    </div>
  </div>
</div>

<div class="sheet" id="clearSheet">
  <div class="panel" role="dialog" aria-label="清除">
    <h3>清除全部紀錄？</h3>
    <p>會把這支手機上的所有紀錄刪掉，動作清單也會回到預設。刪掉就找不回來了，建議先匯出備份。</p>
    <div class="actions">
      <button id="clearCancel">取消</button>
      <button class="danger" id="clearGo">清除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const WD = ['日','一','二','三','四','五','六'];
  const DEFAULT_EX = ['單槓'];
  const QUICK = [5, 8, 10, 12, 15, 20];
  const KEY = 'workoutlog.v1';

  const state = {
    exercises: DEFAULT_EX.slice(),
    days: {},            // date -> {date, sets:[{id, ex, reps, t}]}
    ex: null, range: 'week', armed: null,
    storageOk: true, exportName: '', exportMime: 'application/json',
  };
  let armTimer = null;

  // ---------- helpers ----------
  function pad(n){ return String(n).padStart(2,'0'); }
  function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }
  function parseKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
  function fmtDate(k){ const d = parseKey(k); return (d.getMonth()+1) + '月' + d.getDate() + '日 週' + WD[d.getDay()]; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function sum(arr){ return arr.reduce((a,b)=>a+b,0); }
  function rangeStart(){
    const now = new Date();
    if (state.range === 'month') return keyOf(new Date(now.getFullYear(), now.getMonth(), 1));
    if (state.range === 'week') { const dow = (now.getDay()+6)%7; const d = new Date(now); d.setDate(now.getDate()-dow); return keyOf(d); }
    return '0000-00-00';
  }
  let toastTimer;
  function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1800); }
  function currentReps(){ let v = parseInt($('reps').value, 10); if (!v || v < 1) v = 1; if (v > 999) v = 999; return v; }
  function groupByEx(sets){
    const m = new Map();
    for (const s of sets) { if (!m.has(s.ex)) m.set(s.ex, []); m.get(s.ex).push(s); }
    return m;
  }
  function cleanSets(list){
    if (!Array.isArray(list)) return [];
    return list.filter(s => s && s.ex && Number(s.reps) > 0)
      .map(s => ({ id: String(s.id || uid()), ex: String(s.ex).slice(0,20), reps: Math.min(999, Math.round(Number(s.reps))), t: Number(s.t) || 0 }));
  }

  // ---------- storage (this device only) ----------
  function load(){
    let raw = null;
    try { raw = localStorage.getItem(KEY); }
    catch(e){ state.storageOk = false; }
    if (!raw) return;
    try {
      const d = JSON.parse(raw);
      if (Array.isArray(d.exercises) && d.exercises.length) state.exercises = d.exercises.map(String);
      if (d.days && typeof d.days === 'object') {
        for (const k in d.days) if (/^\d{4}-\d{2}-\d{2}$/.test(k)) state.days[k] = { date: k, sets: cleanSets(d.days[k].sets) };
      }
      if (d.lastEx) state.ex = String(d.lastEx);
      if (Number(d.lastReps) > 0) $('reps').value = Math.min(999, Number(d.lastReps));
    } catch(e){ console.error(e); }
  }
  function persist(){
    const payload = { version: 1, exercises: state.exercises, days: state.days, lastEx: state.ex, lastReps: currentReps() };
    try { localStorage.setItem(KEY, JSON.stringify(payload)); }
    catch(e){ state.storageOk = false; showStorageNotice(); }
  }
  function showStorageNotice(){
    if (state.storageOk) return;
    const n = $('notice'); n.textContent = '這個瀏覽器沒辦法儲存（可能是無痕模式）。現在記的東西關掉頁面就會不見。'; n.classList.add('show');
  }

  // ---------- render ----------
  function render(){ renderHeader(); renderChips(); renderToday(); renderStats(); renderHistory(); }
  function renderHeader(){
    const k = todayKey();
    $('todayDate').textContent = fmtDate(k);
    const sets = (state.days[k] || {sets:[]}).sets;
    $('todayTotal').textContent = sum(sets.map(s=>s.reps));
    $('todaySets').textContent = sets.length;
    $('log').textContent = '記一組' + (state.ex ? '　' + state.ex : '');
    $('log').disabled = !state.ex;
  }
  function renderChips(){
    if (!state.ex || !state.exercises.includes(state.ex)) state.ex = state.exercises[0] || null;
    const c = $('chips'); c.innerHTML = '';
    for (const ex of state.exercises) {
      const b = document.createElement('button');
      b.className = 'chip' + (ex === state.ex ? ' on' : ''); b.textContent = ex;
      b.onclick = () => { state.ex = ex; persist(); render(); };
      c.appendChild(b);
    }
    const add = document.createElement('button');
    add.className = 'chip add'; add.textContent = state.exercises.length ? '編輯' : '＋ 新增動作';
    add.onclick = openSheet; c.appendChild(add);
  }
  function dayRows(container, key, editable){
    const sets = (state.days[key] || {sets:[]}).sets;
    for (const [ex, list] of groupByEx(sets)) {
      const row = document.createElement('div'); row.className = 'row';
      const name = document.createElement('div'); name.className = 'ex'; name.textContent = ex;
      const chips = document.createElement('div'); chips.className = 'sets';
      for (const s of list) {
        const el = document.createElement(editable ? 'button' : 'span');
        const armed = editable && state.armed === s.id;
        el.className = 'set num' + (armed ? ' armed' : '');
        el.textContent = armed ? '刪除' : s.reps;
        if (editable) {
          el.setAttribute('aria-label', armed ? '確認刪除這組' : s.reps + ' 下，點一下可刪除');
          el.onclick = (e) => { e.stopPropagation(); if (armed) removeSet(key, s.id); else arm(s.id); };
        }
        chips.appendChild(el);
      }
      const tot = document.createElement('div'); tot.className = 'tot num';
      tot.innerHTML = sum(list.map(s=>s.reps)) + '<small>下 · ' + list.length + ' 組</small>';
      row.append(name, chips, tot); container.appendChild(row);
    }
  }
  function renderToday(){
    const k = todayKey(); const box = $('todayDay'); box.innerHTML = '';
    const sets = (state.days[k] || {sets:[]}).sets;
    const has = sets.length > 0;
    box.style.display = has ? '' : 'none'; $('todayEmpty').style.display = has ? 'none' : '';
    if (has) dayRows(box, k, true);
  }
  function renderStats(){
    const start = rangeStart();
    const agg = new Map();
    for (const k in state.days) {
      if (k < start) continue;
      for (const s of state.days[k].sets) {
        if (!agg.has(s.ex)) agg.set(s.ex, {total:0, sets:0, days:new Set()});
        const a = agg.get(s.ex); a.total += s.reps; a.sets++; a.days.add(k);
      }
    }
    const box = $('statRows'); box.innerHTML = '';
    if (!agg.size) box.innerHTML = '<div class="empty">這段時間還沒有紀錄。</div>';
    const order = [...state.exercises, ...[...agg.keys()].filter(e=>!state.exercises.includes(e))];
    for (const ex of order) {
      const a = agg.get(ex); if (!a) continue;
      const r = document.createElement('div'); r.className = 'srow';
      r.innerHTML = '<div class="ex"></div>'
        + '<div class="v num">' + a.total + '<small>總共下</small></div>'
        + '<div class="v num">' + a.sets + '<small>組</small></div>'
        + '<div class="v num">' + a.days.size + '<small>天</small></div>';
      r.querySelector('.ex').textContent = ex;
      box.appendChild(r);
    }
    const b = $('bars'); b.innerHTML = '';
    if (!state.ex) { b.style.display = 'none'; return; }
    b.style.display = '';
    const now = new Date(); const keys = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(now); d.setDate(now.getDate()-i); keys.push(keyOf(d)); }
    const vals = keys.map(k => sum(((state.days[k]||{sets:[]}).sets).filter(s=>s.ex===state.ex).map(s=>s.reps)));
    const max = Math.max(1, ...vals);
    const cap = document.createElement('div'); cap.className = 'cap';
    cap.innerHTML = '<span></span><span>最近 14 天 · 最多一天 ' + max + ' 下</span>';
    cap.firstChild.textContent = state.ex;
    const grid = document.createElement('div'); grid.className = 'barsgrid';
    const labels = document.createElement('div'); labels.className = 'barlabels';
    keys.forEach((k, i) => {
      const bar = document.createElement('div');
      bar.className = 'bar' + (vals[i] ? '' : ' zero') + (i === 13 ? ' today' : '');
      bar.style.height = vals[i] ? Math.max(6, Math.round(vals[i] / max * 72)) + 'px' : '3px';
      bar.title = fmtDate(k) + ' ' + vals[i] + ' 下';
      grid.appendChild(bar);
      const l = document.createElement('span'); l.textContent = (i % 2 === 1 || i === 13) ? parseKey(k).getDate() : ''; labels.appendChild(l);
    });
    b.append(cap, grid, labels);
  }
  function renderHistory(){
    const h = $('history'); h.innerHTML = '';
    const today = todayKey();
    const keys = Object.keys(state.days).filter(k => k !== today && state.days[k].sets.length).sort().reverse();
    if (!keys.length) { h.innerHTML = '<div class="empty">還沒有過去的紀錄。</div>'; return; }
    for (const k of keys) {
      const sets = state.days[k].sets;
      const d = document.createElement('div'); d.className = 'day';
      const head = document.createElement('div'); head.className = 'head';
      head.innerHTML = '<b></b><span><span class="num">' + sum(sets.map(s=>s.reps)) + '</span> 下 · ' + sets.length + ' 組</span>';
      head.querySelector('b').textContent = fmtDate(k);
      d.appendChild(head); dayRows(d, k, false); h.appendChild(d);
    }
  }

  // ---------- actions ----------
  function arm(id){ state.armed = id; renderToday(); clearTimeout(armTimer); armTimer = setTimeout(()=>{ state.armed = null; renderToday(); }, 3000); }
  document.addEventListener('click', () => { if (state.armed) { state.armed = null; renderToday(); } });

  function setReps(v){ $('reps').value = v; persist(); }
  function saveDay(key, sets){
    if (sets.length) state.days[key] = { date: key, sets }; else delete state.days[key];
    persist(); render();
  }
  function addSet(){
    if (!state.ex) return;
    const key = todayKey(); const reps = currentReps(); $('reps').value = reps;
    const sets = ((state.days[key] || {sets:[]}).sets).concat([{ id: uid(), ex: state.ex, reps, t: Date.now() }]);
    saveDay(key, sets);
    const b = $('log'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
    toast(state.ex + ' ' + reps + ' 下，記好了');
  }
  function removeSet(key, id){
    state.armed = null;
    saveDay(key, ((state.days[key] || {sets:[]}).sets).filter(s => s.id !== id));
    toast('刪掉了');
  }

  // ---------- exercise sheet ----------
  function exRow(val){
    const r = document.createElement('div'); r.className = 'exrow';
    const i = document.createElement('input'); i.value = val; i.placeholder = '動作名稱，例如：單槓'; i.maxLength = 20;
    const x = document.createElement('button'); x.textContent = '×'; x.setAttribute('aria-label','移除'); x.onclick = () => r.remove();
    r.append(i, x); return r;
  }
  function openSheet(){
    const list = $('exList'); list.innerHTML = '';
    for (const ex of state.exercises) list.appendChild(exRow(ex));
    if (!state.exercises.length) list.appendChild(exRow(''));
    $('sheet').classList.add('open');
    const first = list.querySelector('input'); if (first && !first.value) first.focus();
  }
  function closeSheet(id){ $(id).classList.remove('open'); }
  $('addRow').onclick = () => { const r = exRow(''); $('exList').appendChild(r); r.querySelector('input').focus(); };
  $('cancelEx').onclick = () => closeSheet('sheet');
  $('saveEx').onclick = () => {
    const names = [...$('exList').querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean);
    const list = [...new Set(names)];
    if (!list.length) { toast('至少留一個動作'); return; }
    closeSheet('sheet'); state.exercises = list; persist(); render();
  };
  for (const id of ['sheet','exportSheet','importSheet','clearSheet']) {
    $(id).addEventListener('click', e => { if (e.target === $(id)) closeSheet(id); });
  }

  // ---------- export / import ----------
  function backupJson(){
    return JSON.stringify({ app: 'workoutlog', version: 1, exportedAt: new Date().toISOString(), exercises: state.exercises, days: state.days }, null, 1);
  }
  function backupCsv(){
    const rows = [['日期','動作','次數','時間']];
    for (const k of Object.keys(state.days).sort()) {
      for (const s of state.days[k].sets) {
        const t = s.t ? new Date(s.t) : null;
        rows.push([k, s.ex, s.reps, t ? pad(t.getHours()) + ':' + pad(t.getMinutes()) : '']);
      }
    }
    return '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  }
  function openExport(kind){
    const stamp = todayKey();
    if (kind === 'csv') { state.exportName = '運動紀錄-' + stamp + '.csv'; state.exportMime = 'text/csv'; $('exportBox').value = backupCsv(); $('exportTitle').textContent = '匯出 CSV'; }
    else { state.exportName = '運動紀錄備份-' + stamp + '.json'; state.exportMime = 'application/json'; $('exportBox').value = backupJson(); $('exportTitle').textContent = '匯出備份'; }
    $('exportShare').style.display = (navigator.share ? '' : 'none');
    $('exportSheet').classList.add('open');
  }
  $('exportJson').onclick = () => openExport('json');
  $('exportCsv').onclick = () => openExport('csv');
  $('exportClose').onclick = () => closeSheet('exportSheet');
  $('exportCopy').onclick = async () => {
    const box = $('exportBox');
    try { await navigator.clipboard.writeText(box.value); toast('複製好了'); return; } catch(e) {}
    box.focus(); box.select();
    try { if (document.execCommand('copy')) { toast('複製好了'); return; } } catch(e) {}
    toast('請長按文字框自行複製');
  };
  $('exportShare').onclick = async () => {
    const text = $('exportBox').value;
    try {
      const file = new File([text], state.exportName, { type: state.exportMime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: state.exportName }); return; }
      await navigator.share({ title: state.exportName, text });
    } catch(e) { if (!(e && e.name === 'AbortError')) toast('這裡不能分享，改用複製或下載'); }
  };
  $('exportDl').onclick = async () => {
    const text = $('exportBox').value;
    // Inside the claude.ai viewer, downloads go through its save prompt.
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename: state.exportName, data: text }); toast('已匯出'); return; }
      }
    } catch(e) { if (e && e.code === 'declined') return; }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: state.exportMime }));
      a.download = state.exportName; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('已嘗試下載，沒出現就改用複製');
    } catch(e) { toast('這裡不能下載，請用複製'); }
  };

  function mergeBackup(text){
    let d;
    try { d = JSON.parse(text); } catch(e) { throw new Error('看不懂這個內容，確認是之前匯出的備份'); }
    if (!d || typeof d !== 'object' || !d.days) throw new Error('這不是運動紀錄的備份檔');
    let added = 0;
    for (const k in d.days) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
      const incoming = cleanSets(d.days[k] && d.days[k].sets);
      const cur = (state.days[k] || {sets:[]}).sets.slice();
      const have = new Set(cur.map(s => s.id));
      for (const s of incoming) if (!have.has(s.id)) { cur.push(s); have.add(s.id); added++; }
      cur.sort((a,b) => (a.t||0) - (b.t||0));
      if (cur.length) state.days[k] = { date: k, sets: cur };
    }
    if (Array.isArray(d.exercises)) state.exercises = [...new Set([...state.exercises, ...d.exercises.map(String).filter(Boolean)])];
    persist(); render();
    return added;
  }
  $('importBtn').onclick = () => { $('importBox').value = ''; $('importFile').value = ''; $('importSheet').classList.add('open'); };
  $('importCancel').onclick = () => closeSheet('importSheet');
  $('importFile').addEventListener('change', () => {
    const f = $('importFile').files && $('importFile').files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $('importBox').value = String(r.result || ''); }; r.readAsText(f);
  });
  $('importGo').onclick = () => {
    const text = $('importBox').value.trim();
    if (!text) { toast('先選檔案或貼上內容'); return; }
    try { const n = mergeBackup(text); closeSheet('importSheet'); toast('匯入完成，新增了 ' + n + ' 組'); }
    catch(e) { toast(e.message); }
  };

  $('clearAll').onclick = () => $('clearSheet').classList.add('open');
  $('clearCancel').onclick = () => closeSheet('clearSheet');
  $('clearGo').onclick = () => {
    state.days = {}; state.exercises = DEFAULT_EX.slice(); state.ex = null;
    try { localStorage.removeItem(KEY); } catch(e) {}
    closeSheet('clearSheet'); render(); toast('已清除');
  };

  // ---------- wiring ----------
  $('minus').onclick = () => setReps(Math.max(1, currentReps()-1));
  $('plus').onclick = () => setReps(Math.min(999, currentReps()+1));
  $('reps').addEventListener('change', () => setReps(currentReps()));
  $('reps').addEventListener('focus', e => e.target.select());
  $('log').onclick = addSet;
  for (const q of QUICK) { const b = document.createElement('button'); b.className = 'num'; b.textContent = q; b.onclick = () => setReps(q); $('quick').appendChild(b); }
  $('seg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.range = b.dataset.r;
    [...$('seg').children].forEach(x => x.classList.toggle('on', x === b));
    renderStats();
  });

  load(); showStorageNotice(); render();

  let lastKey = todayKey();
  setInterval(() => { const k = todayKey(); if (k !== lastKey) { lastKey = k; render(); } }, 60000);
})();
</script>
</body>
</html>
